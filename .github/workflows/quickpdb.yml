# .github/workflows/quickpdb.yml

name: Quick PDB Toy CryoEM

on:
  workflow_dispatch:
    inputs:
      pdb_id:
        description: "PDB ID to download from RCSB"
        required: true
        default: "1TIM"

      n:
        description: "Number of projection images"
        required: true
        default: "64"

      pixels:
        description: "Image width/height in pixels"
        required: true
        default: "128"

      seed:
        description: "Random seed"
        required: true
        default: "0"

      sigma:
        description: "Gaussian atom width in pixels"
        required: true
        default: "1.25"

jobs:
  quickpdb:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ChemToy
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run quick PDB experiment
        run: |
          python scripts/run_experiment.py \
            --source-kind pdb \
            --pdb-id "${{ github.event.inputs.pdb_id }}" \
            --n "${{ github.event.inputs.n }}" \
            --pixels "${{ github.event.inputs.pixels }}" \
            --seed "${{ github.event.inputs.seed }}" \
            --sigma "${{ github.event.inputs.sigma }}" \
            --output-dir results

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add results/

          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Add quick PDB ChemToy results"
            git push
          fi
